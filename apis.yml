description: Raid Base Inc. is a Los Angeles-based game development studio, founded in 2020, building an open-world,
  sandbox PvPvE game in an original IP where players and crews build reputations through farming, trading, building,
  fighting, and politics. The team draws from Riot Games, Valve, Blizzard, Microsoft, and Bungie, and the studio has
  raised roughly $34.4M from investors including Andreessen Horowitz (a16z), BITKRAFT Ventures, Patron, F4 Fund, and
  Dreamhaven. Surfaced as an a16z portfolio company and added to the API Evangelist network; the studio publishes no
  public developer API, SDK, documentation, or developer platform at this time.
